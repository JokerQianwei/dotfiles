# Linux SSH tmux：Nord 样式、geohot 键位和 OSC 52 剪贴板集成。

# 终端能力
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g terminal-features "xterm-kitty:RGB:clipboard:ccolour:cstyle:focus:title,xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB:clipboard,ghostty:RGB:clipboard,tmux*:RGB:clipboard"
set -g terminal-overrides "xterm-ghostty:Tc,ghostty:Tc,tmux-256color:Tc"
set -g allow-passthrough on

# 前缀键和基础键位
unbind-key C-b
set -g prefix '`'
set -g prefix2 '·'
bind-key '`' last-window
bind-key '·' last-window
bind-key e send-prefix

# 响应速度和历史记录
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# 窗口和面板
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g window-size latest

# 鼠标和复制模式
set -g mouse on
setw -g mode-keys vi

# 通过 OSC 52 将 tmux 和 Neovim 的选择写入本地终端剪贴板。
set -s set-clipboard on
set -s copy-command ''

# v 开始选择，y、Enter 或鼠标松开后通过客户端终端复制。
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52-copy '#{pane_id}'"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52-copy '#{pane_id}'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52-copy '#{pane_id}'"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-osc52-copy '#{pane_id}'"

# 常用操作
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
unbind-key |
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key Tab switch-client -l
bind-key f display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer /data /workspace ~/code"
bind-key p display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Nord 状态栏
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left '#[fg=#2E3440,bg=#5E81AC,bold] #S '
set -g status-right '#[fg=#D8DEE9,bg=#3B4252] %m/%d #[fg=#2E3440,bg=#88C0D0,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 50
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style default
setw -g window-status-current-format '#[fg=#2E3440,bg=#88C0D0,bold] #I:#W#F '
setw -g window-status-format '#[fg=#D8DEE9,bg=#3B4252] #I:#W#F '
setw -g window-status-separator ' '

# Nord 面板、复制模式、时钟和消息
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#5E81AC"
setw -g mode-style "fg=#2E3440,bg=#88C0D0"
setw -g clock-mode-colour "#88C0D0"
set -g message-style "bg=#4C566A,fg=#88C0D0"
set -g message-command-style "bg=#4C566A,fg=#88C0D0"
set -g display-time 2000
