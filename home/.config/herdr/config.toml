onboarding = false
[keys]
prefix = "backtick"
last_pane = "prefix+alt+p"
rename_tab = "prefix+comma"
split_vertical = 'prefix+\'

[experimental]
pane_history = true

[theme]
name = "nord"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[session]
resume_agents_on_restore = true
