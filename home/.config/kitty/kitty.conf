# Nord Light 终端。
shell                     /opt/homebrew/bin/fish
font_family               JetBrainsMono Nerd Font
bold_italic_font          auto
font_size                 13.0

# 将两侧 Option 作为终端 Alt，避免输入 macOS 特殊符号。
macos_option_as_alt       both
macos_titlebar_color      background

# 使用无装饰且无额外留白的窗口。
window_padding_width      0
hide_window_decorations  yes
confirm_os_window_close  0

# 使用完全不透明的 Nord Light 背景。
background_opacity       1.0
background_blur          0

# 使用不闪烁的块状光标，并关闭声音提示。
cursor_shape              block
cursor_blink_interval     0
shell_integration         no-cursor
enable_audio_bell         no

# 粘贴时不再确认终端控制码，保留 URL 自动引用。
paste_actions             quote-urls-at-prompt

# 允许 SSH 中的 Neovim 通过 OSC 52 读取本机剪贴板。
clipboard_control         write-clipboard write-primary read-clipboard read-primary-ask

# Omarchy 的跨终端复制、粘贴键位。
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

# cmd+数字 切换到第 N 个标签页。
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# 标签栏隐藏时，通过临时列表查看和切换标签页。
map cmd+shift+space select_tab

visual_bell_color        none

# 隐藏标签栏，避免与 tmux 状态栏重复。
tab_bar_edge              bottom
tab_bar_style             hidden
tab_powerline_style       slanted
active_tab_font_style    bold
inactive_tab_font_style  normal
tab_title_template        "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

# Tinted8 主题缺少可选背景时使用 Nord 回退色；完整主题会覆盖这些值。
inactive_border_color     #3b4252
inactive_tab_background  #3b4252
tab_bar_background       #3b4252

# 配色由 Tinty 的官方 tinted-terminal 模板生成。
include ~/.local/share/tinted-theming/tinty/tinted-terminal-themes-kitty-file.conf
