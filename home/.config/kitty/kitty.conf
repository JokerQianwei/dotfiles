# 终端正文参考 geohot 的纯黑终端。
shell                     /opt/homebrew/bin/fish
font_family               DejaVu Sans Mono
font_size                 13.0

# 将两侧 Option 作为终端 Alt，避免输入 macOS 特殊符号。
macos_option_as_alt       both

# 标题栏跟随当前背景色。
macos_titlebar_color      background

# 使用完全不透明的纯黑背景。
background_opacity       1.0
background_blur          0

# 粘贴时不再确认终端控制码，保留 URL 自动引用。
paste_actions             quote-urls-at-prompt

# 允许 SSH 中的 Neovim 通过 OSC 52 读取本机剪贴板。
clipboard_control         write-clipboard write-primary read-clipboard read-primary-ask

foreground              #e6e6e6
background              #000000
selection_foreground    #000000
selection_background    #334e5e

cursor                   #e6e6e6
cursor_text_color        #000000
url_color                #328eee

active_border_color      #338eee
inactive_border_color    #686868
bell_border_color        #dd7975
visual_bell_color        none

# 标签页使用同一背景，以文字颜色和字重区分状态。
tab_bar_margin_width     6.0
tab_bar_style            separator
tab_separator            "  "
active_tab_foreground    #6c9aa6
active_tab_background    #000000
active_tab_font_style    bold
inactive_tab_foreground  #7f8790
inactive_tab_background  #000000
inactive_tab_font_style  normal
tab_bar_background       none
tab_bar_margin_color     none

mark1_foreground         #3b4252
mark1_background         #88c0d0
mark2_foreground         #3b4252
mark2_background         #bf616a
mark3_foreground         #3b4252
mark3_background         #ebcb8b

color0                   #000000
color1                   #b45648
color2                   #6caa71
color3                   #c4ac62
color4                   #6d96b4
color5                   #bd7bcd
color6                   #7ccbcd
color7                   #dee5eb
color8                   #465c6d
color9                   #df6c5a
color10                  #79be7e
color11                  #e5c872
color12                  #67b5ed
color13                  #d389e5
color14                  #84dde0
color15                  #e5eff5
