# Omarchy 风格的 Tokyo Night 终端。
shell                     /opt/homebrew/bin/fish
font_family               JetBrainsMono Nerd Font
bold_italic_font          auto
font_size                 13.0

# 将两侧 Option 作为终端 Alt，避免输入 macOS 特殊符号。
macos_option_as_alt       both
macos_titlebar_color      background

# Omarchy 使用无装饰窗口和 14 像素留白。
window_padding_width      14
hide_window_decorations  yes
confirm_os_window_close  0

# 使用完全不透明的 Tokyo Night 深色背景。
background_opacity       1.0
background_blur          0

# 使用不闪烁的块状光标，并关闭声音提示。
cursor_shape              block
cursor_blink_interval     0
shell_integration         no-cursor
enable_audio_bell         no

# 粘贴时不再确认终端控制码，保留 URL 自动引用。
paste_actions             quote-urls-at-prompt

# 允许 SSH 中的 Neovim 通过 OSC 52 读取本机剪贴板。
clipboard_control         write-clipboard write-primary read-clipboard read-primary-ask

# Omarchy 的跨终端复制、粘贴键位。
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

# cmd+数字 切换到第 N 个标签页。
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

foreground              #a9b1d6
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #292e42

cursor                   #c0caf5
cursor_text_color        #1a1b26
url_color                #7aa2f7

active_border_color      #7aa2f7
inactive_border_color    #414868
bell_border_color        #f7768e
visual_bell_color        none

# Omarchy 的底部倾斜 Powerline 标签页。
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
active_tab_foreground    #13141c
active_tab_background    #7aa2f7
active_tab_font_style    bold
inactive_tab_foreground  #565f89
inactive_tab_background  #13141c
inactive_tab_font_style  normal
tab_title_template        "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

mark1_foreground         #1a1b26
mark1_background         #7aa2f7
mark2_foreground         #1a1b26
mark2_background         #f7768e
mark3_foreground         #1a1b26
mark3_background         #e0af68

color0                   #1a1b26
color1                   #f7768e
color2                   #9ece6a
