# macOS tmux：Nord 样式、geohot 键位和本机剪贴板集成。

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g default-shell "/opt/homebrew/bin/fish"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB:clipboard,ghostty:RGB:clipboard,tmux*:RGB:clipboard"
set -g terminal-overrides "xterm-ghostty:Tc,ghostty:Tc,tmux-256color:Tc"

# 允许嵌套的远端 tmux 将 OSC 52 剪贴板内容传给 Kitty。
set -g allow-passthrough on

# geohot-style core: backtick prefix, WeType middle-dot fallback,
# fast last-window, and vi ergonomics.
unbind-key C-b
set -g prefix '`'
set -g prefix2 '·'
bind-key '`' last-window
bind-key '·' last-window
bind-key e send-prefix

# Responsiveness and history
set -s escape-time 0
set -g focus-events on
# Keep a deeper scrollback than geohot's public config while preserving the
# same minimalist keymap and status-line feel.
set -g history-limit 50000

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g window-size latest

# Mouse and copy mode
set -g mouse on
setw -g mode-keys vi

# Use macOS pbcopy for tmux selections. Keep set-clipboard external so tmux
# itself may use terminal clipboard integration without letting arbitrary apps
# inside tmux write to the clipboard via OSC 52.
set -s set-clipboard external
set -s copy-command "pbcopy"

# Copy-mode bindings: v to select, y/Enter/mouse-release to copy to macOS.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# 使用前缀 + P 粘贴 macOS 剪贴板，Kitty 中的 Cmd+V 仍可使用。
bind-key P run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Quality-of-life bindings
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Nord 状态栏。
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left '#[fg=#2E3440,bg=#5E81AC,bold] #S '
set -g status-right '#[fg=#D8DEE9,bg=#3B4252] %d/%m #[fg=#2E3440,bg=#88C0D0,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
setw -g window-status-current-format '#[fg=#2E3440,bg=#88C0D0,bold] #I:#W#F '
setw -g window-status-format '#[fg=#D8DEE9,bg=#3B4252] #I:#W#F '
setw -g window-status-separator ' '

# Nord 面板、复制模式、时钟和消息。
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#5E81AC"
setw -g mode-style "fg=#2E3440,bg=#88C0D0"
setw -g clock-mode-colour "#88C0D0"
set -g message-style "bg=#4C566A,fg=#88C0D0"
set -g message-command-style "bg=#4C566A,fg=#88C0D0"
set -g display-time 2000
